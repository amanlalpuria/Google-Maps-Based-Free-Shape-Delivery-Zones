<!DOCTYPE html>
<html>
<head>
    <title>Find Nearest Store - Customer View</title>
    <meta charset="UTF-8">
    <style>
        #map {
            height: 400px;
            width: 100%;
        }
        #info {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 6px;
            width: 100%;
        }
    </style>
</head>
<body>
<h2>Find Nearest Store</h2>
<input id="addressInput" type="text" placeholder="Enter your address..." size="50">
<button onclick="searchAddress()">Find Location</button>
<div id="map"></div>
<div id="info"></div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC0bA_FMrXNSSKiAE20XYyaFNi1JA11YSc&libraries=places"></script>
<script>
        let map;
        let marker;
        let geocoder;
        let customerLatLng = null;

        function initMap() {
            const defaultLocation = { lat: 19.0760, lng: 72.8777 }; // Mumbai default

            map = new google.maps.Map(document.getElementById("map"), {
                center: defaultLocation,
                zoom: 12,
            });

            geocoder = new google.maps.Geocoder();

            map.addListener("click", (e) => {
                placeMarker(e.latLng);
                fetchDeliveryInfo(e.latLng.lat(), e.latLng.lng());
            });
        }

        function searchAddress() {
            const address = document.getElementById("addressInput").value;
            if (!address) return alert("Please enter an address.");

            geocoder.geocode({ address: address }, (results, status) => {
                if (status === "OK") {
                    const location = results[0].geometry.location;
                    placeMarker(location);
                    map.setCenter(location);
                    fetchDeliveryInfo(location.lat(), location.lng());
                } else {
                    alert("Geocode failed: " + status);
                }
            });
        }

        function placeMarker(location) {
            if (marker) {
                marker.setPosition(location);
            } else {
                marker = new google.maps.Marker({
                    position: location,
                    map: map
                });
            }
            customerLatLng = location;
        }

        function fetchDeliveryInfo(lat, lng) {
            fetch(`http://localhost:8080/api/customer/get-delivery-info?lat=${lat}&lng=${lng}`)
                .then(response => {
                    if (!response.ok) throw new Error("No delivery info available");
                    return response.json();
                })
                .then(data => {
                    displayInfo(data);
                })
                .catch(err => {
                    document.getElementById("info").innerHTML = `<strong style="color:red;">${err.message}</strong>`;
                });
        }

        function displayInfo(data) {
            const infoDiv = document.getElementById("info");
            infoDiv.innerHTML = `
                <h3>Delivery Details:</h3>
                <p><strong>Store:</strong> ${data.storeName} (ID: ${data.storeId})</p>
                <p><strong>Zone:</strong> ${data.zoneName} (ID: ${data.zoneId})</p>
                <p><strong>Base Fee:</strong> ₹${data.baseFee}</p>
                <p><strong>Per Mile Fee:</strong> ₹${data.perMileFee ?? 0}</p>
                <p><strong>Total Fee:</strong> ₹${data.totalFee}</p>
                <p><strong>Estimated Delivery Time:</strong> ${data.estimatedDeliveryTime} mins</p>
                <p><strong>Within Zone:</strong> ${data.withinZone ? "Yes" : "No"}</p>
            `;
        }

        window.onload = initMap;
    </script>
</body>
</html>
